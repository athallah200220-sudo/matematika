<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator & Tabel Anuitas Pinjaman</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen py-10 px-4">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-600 mb-2">
                <i class="fa-solid fa-calculator mr-2"></i> Kalkulator Tabel Anuitas
            </h1>
            <p class="text-slate-500">Hitung cicilan pinjaman dan buat jadwal angsuran (amortisasi) secara otomatis.</p>
        </header>

        <!-- Main Card -->
        <div class="bg-white shadow-xl rounded-2xl p-6 md:p-8 grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- Form Input -->
            <div class="md:col-span-1 space-y-4">
                <h2 class="text-xl font-semibold text-slate-700 border-b pb-2">Parameter Kredit</h2>
                
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Jumlah Pinjaman (Rp)</label>
                    <input type="number" id="plafond" value="100000000" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Suku Bunga per Tahun (%)</label>
                    <input type="number" id="bunga" value="12" step="0.1" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Tenor / Jangka Waktu (Bulan)</label>
                    <input type="number" id="tenor" value="12" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <button onclick="hitungAnuitas()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition duration-200 cursor-pointer shadow-md">
                    <i class="fa-solid fa-rotate-right mr-1"></i> Hitung Anuitas
                </button>
            </div>

            <!-- Hasil & Ringkasan -->
            <div class="md:col-span-2 flex flex-col justify-between space-y-6">
                <div>
                    <h2 class="text-xl font-semibold text-slate-700 border-b pb-2 mb-4">Ringkasan Pembiayaan</h2>
                    <div id="ringkasan" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                            <span class="block text-xs font-semibold text-indigo-500 uppercase">Cicilan / Bulan</span>
                            <span id="resAngsuran" class="text-lg font-bold text-indigo-900">Rp 0</span>
                        </div>
                        <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                            <span class="block text-xs font-semibold text-emerald-500 uppercase">Total Bunga</span>
                            <span id="resTotalBunga" class="text-lg font-bold text-emerald-900">Rp 0</span>
                        </div>
                        <div class="bg-amber-50 p-4 rounded-xl border border-amber-100">
                            <span class="block text-xs font-semibold text-amber-500 uppercase">Total Pembayaran</span>
                            <span id="resTotalBayar" class="text-lg font-bold text-amber-900">Rp 0</span>
                        </div>
                    </div>
                </div>

                <!-- Aksi Tabel -->
                <div class="flex justify-between items-center">
                    <h3 class="font-semibold text-slate-700">Tabel Jadwal Angsuran</h3>
                    <div class="space-x-2">
                        <button onclick="salinTabel()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium transition cursor-pointer">
                            <i class="fa-regular fa-copy mr-1"></i> Salin Data
                        </button>
                        <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition cursor-pointer">
                            <i class="fa-solid fa-print mr-1"></i> Cetak
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabel Amortisasi -->
        <div class="bg-white shadow-xl rounded-2xl p-6 mt-6 overflow-hidden">
            <div class="overflow-x-auto max-h-[400px]">
                <table id="tabelAmortisasi" class="w-full border-collapse text-left text-sm text-slate-600">
                    <thead class="bg-slate-100 text-slate-700 uppercase text-xs sticky top-0">
                        <tr>
                            <th class="p-3">Bulan</th>
                            <th class="p-3">Angsuran</th>
                            <th class="p-3">Porsi Bunga</th>
                            <th class="p-3">Porsi Pokok</th>
                            <th class="p-3">Sisa Pokok</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200">
                        <!-- Data akan dimasukkan lewat JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script Kalkulator Anuitas -->
    <script>
        let dataTabelGlobal = [];

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
        }

        function hitungAnuitas() {
            let plafond = parseFloat(document.getElementById('plafond').value) || 0;
            let bungaTahunan = parseFloat(document.getElementById('bunga').value) || 0;
            let tenor = parseInt(document.getElementById('tenor').value) || 0;

            if (plafond <= 0 || tenor <= 0) {
                alert("Masukkan jumlah pinjaman dan tenor dengan benar!");
                return;
            }

            let i = (bungaTahunan / 100) / 12;
            let angsuran = 0;

            if (i === 0) {
                angsuran = plafond / tenor;
            } else {
                angsuran = plafond * (i * Math.pow(1 + i, tenor)) / (Math.pow(1 + i, tenor) - 1);
            }

            let sisaPokok = plafond;
            let totalBunga = 0;
            let tbody = document.querySelector("#tabelAmortisasi tbody");
            tbody.innerHTML = "";
            dataTabelGlobal = [];

            for (let b = 1; b <= tenor; b++) {
                let porsiBunga = sisaPokok * i;
                let porsiPokok = angsuran - porsiBunga;
                sisaPokok -= porsiPokok;
                if (sisaPokok < 0 || b === tenor) sisaPokok = 0;

                totalBunga += porsiBunga;

                dataTabelGlobal.push({
                    bulan: b,
                    angsuran: Math.round(angsuran),
                    bunga: Math.round(porsiBunga),
                    pokok: Math.round(porsiPokok),
                    sisa: Math.round(sisaPokok)
                });

                let row = `<tr class="hover:bg-slate-50">
                    <td class="p-3 font-medium">${b}</td>
                    <td class="p-3">${formatRupiah(angsuran)}</td>
                    <td class="p-3 text-rose-600">${formatRupiah(porsiBunga)}</td>
                    <td class="p-3 text-indigo-600">${formatRupiah(porsiPokok)}</td>
                    <td class="p-3 font-medium">${formatRupiah(sisaPokok)}</td>
                </tr>`;
                tbody.innerHTML += row;
            }

            let totalBayar = plafond + totalBunga;

            document.getElementById('resAngsuran').innerText = formatRupiah(angsuran);
            document.getElementById('resTotalBunga').innerText = formatRupiah(totalBunga);
            document.getElementById('resTotalBayar').innerText = formatRupiah(totalBayar);
        }

        function salinTabel() {
            if (dataTabelGlobal.length === 0) {
                alert("Belum ada data untuk disalin.");
                return;
            }
            let text = "Bulan\tAngsuran\tBunga\tPokok\tSisa Pokok\n";
            dataTabelGlobal.forEach(row => {
                text += `${row.bulan}\t${row.angsuran}\t${row.bunga}\t${row.pokok}\t${row.sisa}\n`;
            });
            navigator.clipboard.writeText(text).then(() => {
                alert("Data berhasil disalin! Anda bisa langsung tempel (paste) ke Microsoft Excel / Google Sheets.");
            });
        }

        // Jalankan perhitungan awal saat halaman dimuat
        window.onload = hitungAnuitas;
    </script>
</body>
</html>
